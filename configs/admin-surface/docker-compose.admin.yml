# The Master's admin surface, as committed config.
#
# This file exists so the admin page survives a redeploy. Panel customisations made
# by clicking do not, and a surface that only exists in a database is a surface
# nobody can review — which is the wrong property for the one place an injection
# would do the most damage.
#
# DEPLOYED on the Master (agx32) — the container `sparknet-admin-webui` runs with
# this file's topology and binds `10.100.0.1:8088`. The bind needs the overlay
# address to exist first: if the Docker daemon starts the container before
# `sparknet-master-wireguard-anchor.service` has brought `wg1` up, the container
# dies with `bind: cannot assign requested address` (exit 128). The anchor unit
# carries `Before=docker.service` for exactly this reason. What is verified
# structurally is that the surface carries no signing capability: see
# ../../manifests/admin-surface.json and ../../tests/test_admin_surface.py.
#
# The single rule this file exists to enforce: `sign` is not obtainable from
# anything reachable in this compose file. The operational key is not mounted, the
# signer socket is not mounted, and the only thing the surface can do about a
# signature is ask for one.
name: sparknet-admin-surface

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_TAG:-v0.13.0}
    container_name: sparknet-admin-webui
    restart: unless-stopped
    # Open WebUI stays on host loopback; nginx owns the overlay-only 8088
    # surface. The Master is the one role that must not inherit the peer's
    # egress rule; overlay-only binding is about who may reach the page, not
    # what the page may reach.
    # Host networking lets the admin page reach the Master's own loopback
    # Ollama and the loopback OpenCode engine. The nginx sidecar owns the only
    # published overlay address (10.100.0.1:8088).
    network_mode: host
    environment:
      HOST: "127.0.0.1"
      PORT: "8080"
      # The vault is the only knowledge base. Open WebUI's own vector store would
      # be a second one that no signed entry can revoke, which makes it the quieter
      # way to lose control of what the fabric knows.
      RAG_INGESTION_ENABLED: "false"
      WEBUI_AUTH: "true"
      # The admin surface is admin-only by policy: the human administrator is the
      # only account. Every other user lives on the peer and is reached through
      # the peer's signed admin channel.
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: "pending"
      WEBUI_ADMIN_EMAIL: "${SPARKNET_WEBUI_ADMIN_EMAIL:-admin@sparknet.local}"
      WEBUI_ADMIN_PASSWORD: "${SPARKNET_WEBUI_ADMIN_PASSWORD:?set at deploy time; do not commit the admin password}"
      WEBUI_ADMIN_NAME: "${SPARKNET_WEBUI_ADMIN_NAME:-Sparknet Admin}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?set at deploy time; do not commit the secret}"
      WEBUI_NAME: "Sparknet Master"
      WEBUI_URL: "${SPARKNET_WEBUI_PUBLIC_URL:-http://10.100.0.1:8088}"
      OLLAMA_BASE_URL: "http://127.0.0.1:11434"
      OPENAI_API_BASE_URLS: "http://127.0.0.1:4204/v1"
      OPENAI_API_KEYS: "${SPARKNET_OPENCODE_ENGINE_TOKEN:?set at deploy time; do not commit the engine token}"
      DEFAULT_MODELS: "sparknet-chat"
      MODEL_FILTER_ENABLED: "true"
      MODEL_FILTER_LIST: "sparknet-chat,sparknet-plan,qwen3.6-35b-262k:latest,qwen3.6-35b-262k-q8:latest,llama3.2:latest"
      ENABLE_MEMORIES: "false"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
    volumes:
      - open-webui-data:/app/backend/data
      # Read-only. The surface reads the vault; it does not get to rewrite the
      # contract or the plan through a bind mount.
      - ../..:/workspace/sparknet:ro
    # No signer socket, no $SPARKNET_STATE_DIR, no key material. If a future edit
    # adds one, the test that reads ../manifests/admin-surface.json should fail —
    # and if it does not, that test is the defect, not the edit.

  # The same-origin proxy: it owns the overlay-only 8088 bind, injects the
  # Sparknet launcher into Open WebUI's HTML and routes the read-only console.
  nginx:
    image: nginx:1.27-alpine
    container_name: sparknet-admin-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      SPARKNET_BIND: "10.100.0.1:8088"
      SPARKNET_CONSOLE_UPSTREAM: "127.0.0.1:8098"
      SPARKNET_WEBUI_PORT: "8080"
    volumes:
      - ../../../webui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../../webui/console/sparknet-menu.js:/etc/nginx/sparknet-menu.js:ro
    depends_on:
      - open-webui
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://10.100.0.1:8088/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The opencode terminal has no listener of its own: an operator reaches it over
  # the overlay with their own client, and it reads ../opencode.json. It is listed
  # here so the surface has one obvious place to be configured, not because a
  # container is needed to run a terminal.

volumes:
  open-webui-data:
